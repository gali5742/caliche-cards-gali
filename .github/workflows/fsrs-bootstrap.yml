name: FSRS dependency bootstrap

on:
  push:
    branches:
      - phase2-fsrs-core

permissions:
  contents: write

jobs:
  install:
    if: ${{ !contains(github.event.head_commit.message, '[fsrs-bootstrap]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2-fsrs-core
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install ts-fsrs@5.4.1 --save-exact
      - name: Commit lockfile update
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: add ts-fsrs 5.4.1 [fsrs-bootstrap]"
          git push origin HEAD:phase2-fsrs-core
